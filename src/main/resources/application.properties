ai.model.primary=xiaomi/mimo-v2-flash:free
news.autoImpact.enabled=true
news.autoImpact.max=3
ai.temperature=0.0
ai.response.strictJson=true
ai.maxTokens=1000
ai.http.connectTimeoutMs=10000
ai.http.readTimeoutMs=90000
ai.http.writeTimeoutMs=90000