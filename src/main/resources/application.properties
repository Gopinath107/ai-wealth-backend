# --- SERVER ---
spring.application.name=djai
server.port=${PORT:8080}
# Relax Tomcat security for pipe symbols in URLs
server.tomcat.relaxed-path-chars=|,<,>,^
server.tomcat.relaxed-query-chars=|,<,>,^

# --- DATABASE (Cloud vs Local) ---
# If DB_URL is set (Cloud), use it. Otherwise use localhost (Dev)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wealth?currentSchema=dj}
spring.datasource.username=${DB_USERNAME:dj}
spring.datasource.password=${DB_PASSWORD:dj}

spring.datasource.hikari.connection-init-sql=SET search_path TO dj
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- SECURITY ---
jwt.secret=${JWT_SECRET:rms-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-for-HS256-algorithm}
jwt.expiration=86400000

# --- UPSTOX ---
upstox.instruments.url=https://assets.upstox.com/market-quote/instruments/exchange/complete.json.gz
upstox.instruments.cron=0 30 6 * * *
upstox.baseUrl=https://api.upstox.com/v2
upstox.v3.baseUrl=https://api.upstox.com/v3
upstox.authDialogUrl=https://api.upstox.com/v2/login/authorization/dialog
upstox.authTokenUrl=https://api.upstox.com/v2/login/authorization/token
upstox.v3AuthorizeUrl=https://api.upstox.com/v3/feed/market-data-feed/authorize
upstox.baseHost=https://api.upstox.com

# Sensitive Upstox Keys
upstox.accessToken=${UPSTOX_ACCESS_TOKEN}
upstox.clientId=${UPSTOX_CLIENT_ID}
upstox.clientSecret=${UPSTOX_CLIENT_SECRET}
upstox.redirectUrl=${UPSTOX_REDIRECT_URL:http://localhost:8080/upstox/callback}
app.upstox.polling.enabled=false

# --- UPSTOX INDICES ---
upstox.index.nifty50=NSE_INDEX|Nifty 50
upstox.index.niftyBank=NSE_INDEX|Nifty Bank
upstox.index.sensex=BSE_INDEX|SENSEX

